name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Gmail-Pipeline.slnx

      - name: Build
        run: dotnet build Gmail-Pipeline.slnx --no-restore

      - name: Test
        run: dotnet test Gmail-Pipeline.slnx --no-build --filter "Category!=Integration"
